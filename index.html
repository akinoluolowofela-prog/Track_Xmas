
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09251b">
  <meta name="description" content="Christmas countdown to December 25.">
  <title>Christmas Countdown</title>

  <style>
    :root {
      color-scheme: dark;
      --bg-a: #123d2c;
      --bg-b: #061a14;
      --accent: #e34b4b;
      --accent-soft: rgba(227,75,75,.25);
      --gold: #f5d77b;
      --panel: rgba(255,255,255,.085);
      --line: rgba(255,255,255,.15);
      --muted: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--bg-a), white 12%), transparent 58%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b) 72%);
      transition: background .5s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .18;
      pointer-events: none;
      z-index: 0;
      background: var(--accent);
    }

    body::before {
      top: -170px;
      right: -100px;
    }

    body::after {
      bottom: -190px;
      left: -110px;
      background: var(--gold);
    }

    .snow-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      top: -18px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #fff;
      opacity: var(--opacity);
      animation: snowfall var(--duration) linear forwards;
    }

    @keyframes snowfall {
      to {
        transform: translate3d(var(--drift), 110vh, 0);
        opacity: .05;
      }
    }

    main {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,0,0,.14);
      color: var(--gold);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .16em;
    }

    .tree {
      font-size: clamp(3rem, 8vw, 4.5rem);
      line-height: 1;
      margin: 24px 0 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 7vw, 4.6rem);
      line-height: 1.02;
      letter-spacing: -.055em;
    }

    h1 span {
      color: var(--gold);
    }

    .subtitle {
      max-width: 510px;
      margin: 16px auto 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: clamp(.95rem, 2vw, 1.08rem);
    }

    .greeting {
      min-height: 28px;
      margin: 24px 0 18px;
      color: var(--gold);
      font-weight: 650;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 16px);
      padding: clamp(12px, 3vw, 22px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0,0,0,.24);
      backdrop-filter: blur(18px);
    }

    .time-card {
      min-width: 0;
      padding: clamp(10px, 2.5vw, 18px) 5px;
      border-radius: 16px;
      background: rgba(0,0,0,.16);
    }

    .number {
      display: block;
      color: #fff;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 28px var(--accent-soft);
    }

    .label {
      display: block;
      margin-top: 9px;
      color: var(--gold);
      font-size: .68rem;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .progress {
      width: min(520px, 100%);
      margin: 28px auto 0;
      text-align: left;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .82rem;
    }

    .progress-head strong {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.16);
    }

    .fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transition: width .8s ease;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin: 28px auto 0;
    }

    button {
      min-height: 42px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.16);
      font: inherit;
      font-size: .82rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.12);
    }

    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    button[aria-pressed="true"] {
      color: #172016;
      background: var(--gold);
      border-color: var(--gold);
    }

    .sound {
      margin-top: 12px;
    }

    footer {
      margin-top: 30px;
      color: rgba(255,255,255,.52);
      font-size: .78rem;
    }

    @media (max-width: 420px) {
      body { padding: 26px 12px; }

      .countdown {
        gap: 6px;
        padding: 9px;
        border-radius: 18px;
      }

      .time-card {
        padding: 12px 2px;
        border-radius: 12px;
      }

      .label {
        font-size: .58rem;
        letter-spacing: .08em;
      }

      button {
        padding-inline: 12px;
        font-size: .76rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="snow-layer" id="snow" aria-hidden="true"></div>

  <main>
    <div class="eyebrow">CHRISTMAS COUNTDOWN</div>

    <div class="tree" aria-hidden="true">✳</div>

    <h1 id="main-title">
      Christmas <span>Countdown</span>
    </h1>

    <p class="subtitle">Countdown to December 25.</p>

    <p class="greeting" id="greeting" aria-live="polite">
      Time remaining until December 25
    </p>

    <section class="countdown" aria-label="Time remaining until Christmas">

      <div class="time-card">
        <span class="number" id="days">000</span>
        <span class="label">Days</span>
      </div>

      <div class="time-card">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="time-card">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="time-card">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>

    </section>

    <section class="progress" aria-label="Annual Christmas progress">

      <div class="progress-head">
        <span>Annual progress</span>
        <strong id="progress-text">0%</strong>
      </div>

      <div
        class="track"
        id="progress-bar"
        role="progressbar"
        aria-label="Progress through the year toward Christmas"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="fill" id="progress-fill"></div>
      </div>

    </section>

    <div class="toolbar" aria-label="Choose a colour theme">

      <button class="theme-btn"
        data-theme="classic"
        aria-pressed="true">
        Classic Pine
      </button>

      <button class="theme-btn"
        data-theme="crimson"
        aria-pressed="false">
        Midnight Crimson
      </button>

      <button class="theme-btn"
        data-theme="nordic"
        aria-pressed="false">
        Nordic Frost
      </button>

    </div>

    <button class="sound" id="sound-btn" aria-pressed="false">
      Sound off
    </button>

    <footer>December 25</footer>
  </main>

  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    let soundEnabled = false;
    let audioContext = null;
    let snowTimer = null;

    const themes = {
      classic: {
        a: "#123d2c",
        b: "#061a14",
        accent: "#e34b4b",
        soft: "rgba(227,75,75,.25)",
        gold: "#f5d77b",
        title: "Christmas"
      },

      crimson: {
        a: "#501b25",
        b: "#1b080e",
        accent: "#e7b95d",
        soft: "rgba(231,185,93,.25)",
        gold: "#fff0d0",
        title: "Holiday"
      },

      nordic: {
        a: "#245064",
        b: "#0b202b",
        accent: "#70d6e8",
        soft: "rgba(112,214,232,.25)",
        gold: "#d9f5ff",
        title: "Winter"
      }
    };

    function nextChristmas(now) {
      const year = now.getFullYear();

      const thisChristmas = new Date(
        year, 11, 25, 0, 0, 0, 0
      );

      return now < thisChristmas
        ? thisChristmas
        : new Date(year + 1, 11, 25, 0, 0, 0, 0);
    }

    function updateCountdown() {
      const now = new Date();
      const target = nextChristmas(now);

      const remaining = Math.max(
        0,
        target.getTime() - now.getTime()
      );

      const totalSeconds = Math.floor(remaining / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor(totalSeconds / 3600) % 24;
      const minutes = Math.floor(totalSeconds / 60) % 60;
      const seconds = totalSeconds % 60;

      $("days").textContent = String(days).padStart(3, "0");
      $("hours").textContent = String(hours).padStart(2, "0");
      $("minutes").textContent = String(minutes).padStart(2, "0");
      $("seconds").textContent = String(seconds).padStart(2, "0");

      const start = new Date(
        target.getFullYear() - 1,
        11,
        25
      ).getTime();

      const progress = Math.min(
        100,
        Math.max(
          0,
          ((now.getTime() - start) /
          (target.getTime() - start)) * 100
        )
      );

      $("progress-fill").style.width = `${progress}%`;
      $("progress-text").textContent = `${progress.toFixed(1)}%`;

      $("progress-bar").setAttribute(
        "aria-valuenow",
        progress.toFixed(1)
      );

      if (
        now.getMonth() === 11 &&
        now.getDate() === 25
      ) {
        $("greeting").textContent = "Christmas Day";
      } else if (days <= 7) {
        $("greeting").textContent =
          `${days} ${days === 1 ? "day" : "days"} remaining`;
      } else if (days <= 30) {
        $("greeting").textContent =
          "Less than a month remaining";
      } else {
        $("greeting").textContent =
          "Time remaining until December 25";
      }
    }

    function setTheme(name) {
      const theme = themes[name];

      if (!theme) return;

      const root = document.documentElement;

      root.style.setProperty("--bg-a", theme.a);
      root.style.setProperty("--bg-b", theme.b);
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--accent-soft", theme.soft);
      root.style.setProperty("--gold", theme.gold);

      $("main-title").innerHTML =
        `${theme.title} <span>Countdown</span>`;

      document.querySelectorAll(".theme-btn").forEach(button => {
        const active = button.dataset.theme === name;

        button.setAttribute(
          "aria-pressed",
          String(active)
        );
      });
    }

    function addSnowflake() {
      if (reducedMotion.matches) return;

      const layer = $("snow");

      if (layer.childElementCount >= 45) return;

      const flake = document.createElement("span");

      flake.className = "snowflake";

      const size = Math.random() * 4 + 2;
      const duration = Math.random() * 5 + 6;

      flake.style.left = `${Math.random() * 100}%`;
      flake.style.setProperty("--size", `${size}px`);
      flake.style.setProperty("--duration", `${duration}s`);
      flake.style.setProperty(
        "--opacity",
        `${Math.random() * .55 + .2}`
      );
      flake.style.setProperty(
        "--drift",
        `${Math.random() * 100 - 50}px`
      );

      layer.appendChild(flake);

      window.setTimeout(
        () => flake.remove(),
        duration * 1000
      );
    }

    function playChime() {
      if (!soundEnabled || !audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        660,
        audioContext.currentTime
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        880,
        audioContext.currentTime + .18
      );

      gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .07,
        audioContext.currentTime + .03
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime + .55
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + .56);
    }

    async function toggleSound() {
      const button = $("sound-btn");

      if (!soundEnabled) {
        try {
          const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error("Audio is not supported.");
          }

          audioContext ??= new AudioContextClass();

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          soundEnabled = true;
          button.textContent = "Sound on";

          button.setAttribute(
            "aria-pressed",
            "true"
          );

          playChime();

        } catch (error) {
          soundEnabled = false;
          button.textContent = "Sound unavailable";

          button.setAttribute(
            "aria-pressed",
            "false"
          );
        }

      } else {
        soundEnabled = false;
        button.textContent = "Sound off";

        button.setAttribute(
          "aria-pressed",
          "false"
        );
      }
    }

    document.querySelectorAll(".theme-btn").forEach(button => {
      button.addEventListener("click", () => {
        setTheme(button.dataset.theme);
      });
    });

    $("sound-btn").addEventListener(
      "click",
      toggleSound
    );

    updateCountdown();

    window.setInterval(updateCountdown, 1000);

    if (!reducedMotion.matches) {
      addSnowflake();

      snowTimer = window.setInterval(
        addSnowflake,
        280
      );
    }

    reducedMotion.addEventListener?.("change", event => {
      if (event.matches) {
        window.clearInterval(snowTimer);
        $("snow").replaceChildren();

        snowTimer = null;

      } else if (!snowTimer) {
        addSnowflake();

        snowTimer = window.setInterval(
          addSnowflake,
          280
        );
      }
    });
  </script>

</body>
</html>
